[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/unwrap", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["DriveEncryptor contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
nix = { version = "0.29", features = ["mman", "ioctl", "fs"] }
printpdf = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lopdf = "0.34"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
